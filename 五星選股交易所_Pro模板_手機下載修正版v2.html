<style>
#fsx-root {
  --bg-void: #0A0D14;
  --panel: #131A24;
  --panel-raised: #1B2433;
  --line: #2A3445;
  --text-primary: #E9EDF3;
  --text-secondary: #7E8BA0;
  --text-tertiary: #4E5A70;
  --gold: #D9A94E;
  --gold-glow: rgba(217, 169, 78, 0.35);
  --cyan: #4FC3D9;
  --cyan-glow: rgba(79, 195, 217, 0.32);
  --violet: #9D7FE0;
  --violet-glow: rgba(157, 127, 224, 0.32);
  --ash: #7B8499;
  --ash-glow: rgba(123, 132, 153, 0.25);
  --danger: #E0584C;
  --success: #4FBE82;

  background: var(--bg-void);
  color: var(--text-primary);
  font-family: "Noto Sans TC", "Inter", system-ui, sans-serif;
  border-radius: 14px;
  overflow: hidden;
  min-height: 600px;
  display: flex;
  flex-direction: column;
  position: relative;
  isolation: isolate;
}

#fsx-root * { box-sizing: border-box; }

#fsx-root .fsx-mono {
  font-family: "JetBrains Mono", "Space Grotesk", ui-monospace, monospace;
}

/* ---------- Top bar ---------- */
.fsx-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
}
.fsx-topbar-left { display: flex; align-items: center; gap: 10px; }
.fsx-glyph {
  font-family: "JetBrains Mono", monospace;
  color: var(--gold);
  font-size: 18px;
  text-shadow: 0 0 12px var(--gold-glow);
}
.fsx-glyph-lg { font-size: 36px; display: block; margin-bottom: 10px; }
.fsx-title { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
.fsx-title-sub { color: var(--text-secondary); font-weight: 500; font-size: 13px; margin-left: 4px; }
.fsx-topbar-right { display: flex; gap: 22px; }
.fsx-stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.fsx-stat-num { font-family: "JetBrains Mono", monospace; font-size: 17px; font-weight: 600; color: var(--text-primary); }
.fsx-stat-label { font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.06em; }

/* ---------- Toolbar ---------- */
.fsx-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 22px;
  border-bottom: 1px solid var(--line);
  gap: 16px;
  flex-wrap: wrap;
}
.fsx-tabs { display: flex; gap: 6px; }
.fsx-tab {
  background: transparent; border: 1px solid transparent; color: var(--text-secondary);
  font-family: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 7px;
  cursor: pointer; transition: all 0.15s ease;
}
.fsx-tab:hover { color: var(--text-primary); background: var(--panel-raised); }
.fsx-tab.active { color: var(--bg-void); background: var(--text-primary); font-weight: 600; }
.fsx-search {
  background: var(--panel); border: 1px solid var(--line); color: var(--text-primary);
  font-family: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 7px;
  min-width: 200px; outline: none;
}
.fsx-search:focus { border-color: var(--cyan); }
.fsx-search::placeholder { color: var(--text-tertiary); }
.fsx-toolbar-right { display: flex; gap: 10px; align-items: center; }

/* ---------- Notice ---------- */
.fsx-notice {
  font-size: 12px; color: var(--text-tertiary); padding: 8px 22px;
  border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.02);
}

/* ---------- Body / Grid ---------- */
.fsx-body { display: flex; flex: 1; min-height: 0; }
.fsx-grid {
  flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px; padding: 18px; align-content: start; overflow-y: auto;
}

/* ---------- Card ---------- */
.fsx-card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.fsx-card::before {
  content: ""; position: absolute; inset: 0; border-radius: 10px;
  background: linear-gradient(135deg, var(--tier-glow) 0%, transparent 55%);
  opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
}
.fsx-card:hover {
  transform: translateY(-2px);
  border-color: var(--tier-color);
  box-shadow: 0 8px 24px -8px var(--tier-glow);
}
.fsx-card:hover::before { opacity: 1; }
.fsx-card.selected { border-color: var(--tier-color); background: var(--panel-raised); }

/* ---------- 閃卡 foil effect（神話／傳說專屬）---------- */
.fsx-card.fsx-foil {
  border: 1px solid transparent;
  background-image:
    linear-gradient(var(--panel), var(--panel)),
    var(--foil-gradient);
  background-origin: border-box;
  background-clip: padding-box, border-box;
  background-size: 100% 100%, 300% 300%;
  animation: fsx-foil-shift 5s ease-in-out infinite;
}
.fsx-card.fsx-foil-rainbow {
  --foil-gradient: linear-gradient(115deg, #FF6B6B, #FFD93D, #6BFFB8, #4FC3D9, #9D7FE0, #FF6B6B);
}
.fsx-card.fsx-foil-gold {
  --foil-gradient: linear-gradient(115deg, #D9A94E, #FFF3CC, #D9A94E, #8A6A28, #D9A94E);
}
.fsx-card.fsx-foil::after {
  content: ""; position: absolute; inset: 0; border-radius: 10px;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.16) 45%, transparent 60%);
  background-size: 250% 250%;
  animation: fsx-foil-sheen 3.2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes fsx-foil-shift {
  0%, 100% { background-position: 0% 0%, 0% 50%; }
  50% { background-position: 0% 0%, 100% 50%; }
}
@keyframes fsx-foil-sheen {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 100%; }
}
.fsx-tier-tag.fsx-foil-rainbow {
  background: linear-gradient(115deg, #FF6B6B, #FFD93D, #6BFFB8, #4FC3D9, #9D7FE0, #FF6B6B);
  background-size: 300% 300%;
  animation: fsx-foil-shift 5s ease-in-out infinite;
  color: #1A1320;
}
.fsx-tier-tag.fsx-foil-gold {
  background: linear-gradient(115deg, #D9A94E, #FFF3CC, #D9A94E, #8A6A28, #D9A94E);
  background-size: 300% 300%;
  animation: fsx-foil-shift 5s ease-in-out infinite;
  color: #2B2008;
}

.fsx-card-scanline {
  position: absolute; left: 0; right: 0; height: 40%; top: -50%;
  background: linear-gradient(180deg, transparent, rgba(255,255,255,0.06), transparent);
  pointer-events: none; transition: top 0.6s ease;
}
.fsx-card:hover .fsx-card-scanline { top: 120%; }

.fsx-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.fsx-code { font-family: "JetBrains Mono", monospace; font-size: 19px; font-weight: 700; color: var(--text-primary); }
.fsx-tier-tag {
  font-size: 10px; padding: 3px 7px; border-radius: 5px; font-weight: 700; letter-spacing: 0.03em;
  background: var(--tier-glow); color: var(--tier-color); white-space: nowrap;
}
.fsx-name { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 14px; }

.fsx-stars { display: flex; gap: 3px; margin-bottom: 12px; }
.fsx-star-slot { width: 22px; height: 22px; position: relative; }
.fsx-star-slot svg { width: 100%; height: 100%; }
.fsx-star-bg { fill: var(--line); }
.fsx-star-fill { fill: var(--tier-color); filter: drop-shadow(0 0 4px var(--tier-glow)); }

.fsx-star-bg-base, .fsx-foil-star {
  position: absolute; inset: 0;
  -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L1.9 9.8l7.1-.7z"/></svg>');
  mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L1.9 9.8l7.1-.7z"/></svg>');
  -webkit-mask-size: contain; mask-size: contain;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center; mask-position: center;
}
.fsx-foil-star {
  background-image: var(--foil-gradient);
  background-size: 300% 300%;
  animation: fsx-foil-shift 5s ease-in-out infinite;
  filter: drop-shadow(0 0 4px var(--tier-glow));
}
.fsx-foil-star.fsx-foil-rainbow { --foil-gradient: linear-gradient(115deg, #FF6B6B, #FFD93D, #6BFFB8, #4FC3D9, #9D7FE0, #FF6B6B); }
.fsx-foil-star.fsx-foil-gold { --foil-gradient: linear-gradient(115deg, #D9A94E, #FFF3CC, #D9A94E, #8A6A28, #D9A94E); }

.fsx-verdict {
  font-size: 12px; color: var(--text-primary); line-height: 1.5;
  border-top: 1px solid var(--line); padding-top: 10px;
}

/* ---------- Tooltip ---------- */
.fsx-tooltip {
  position: fixed; z-index: 50; pointer-events: none;
  background: #0E1420; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 13px; font-size: 12px; color: var(--text-primary);
  max-width: 240px; line-height: 1.5; box-shadow: 0 12px 30px -10px rgba(0,0,0,0.6);
  transition: opacity 0.1s ease;
}
.fsx-tooltip b { color: var(--gold); }

/* ---------- Detail panel ---------- */
.fsx-detail {
  width: 340px; flex-shrink: 0; border-left: 1px solid var(--line);
  background: #0D131C; padding: 22px; overflow-y: auto;
}
.fsx-detail-empty {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: var(--text-tertiary); font-size: 13px; line-height: 1.6;
}
.fsx-detail-empty[hidden] { display: none; }
.fsx-detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.fsx-detail-code { font-family: "JetBrains Mono", monospace; font-size: 24px; font-weight: 700; }
.fsx-detail-name { color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }
.fsx-detail-stars { display: flex; gap: 4px; margin-bottom: 18px; }
.fsx-detail-stars .fsx-star-slot { width: 26px; height: 26px; }
.fsx-detail-total { font-size: 13px; color: var(--text-secondary); margin-bottom: 22px; }
.fsx-detail-total b { color: var(--text-primary); font-family: "JetBrains Mono", monospace; }

.fsx-breakdown-row {
  display: grid; grid-template-columns: 24px 1fr 36px; gap: 10px; align-items: start;
  padding: 10px 0; border-top: 1px solid var(--line);
}
.fsx-breakdown-row:first-of-type { border-top: none; }
.fsx-bd-star { font-family: "JetBrains Mono", monospace; color: var(--text-tertiary); font-size: 13px; padding-top: 1px; }
.fsx-bd-text { font-size: 12.5px; color: var(--text-primary); line-height: 1.55; }
.fsx-bd-score {
  font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 800; text-align: right;
}
.fsx-bd-score[data-v="1"] { color: #6EE7A8; }
.fsx-bd-score[data-v="0.5"] { color: #FFD166; }
.fsx-bd-score[data-v="0"] { color: #FF6B6B; }

.fsx-updated { font-size: 11px; color: var(--text-tertiary); margin: 18px 0 16px; }

.fsx-download-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel-raised); color: var(--text-primary); font-family: inherit;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
}
.fsx-download-btn:hover { border-color: var(--cyan); background: rgba(79,195,217,0.08); }
.fsx-download-btn:active { transform: scale(0.98); }
.fsx-download-size { color: var(--text-tertiary); font-weight: 400; font-size: 11px; }
.fsx-download-done { color: var(--success) !important; border-color: var(--success) !important; }


/* ---------- Pro refinement blocks ---------- */
.fsx-card-meta { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 12px; }
.fsx-chip { font-size:10.5px; padding:4px 7px; border-radius:999px; border:1px solid var(--line); color:var(--text-secondary); background:rgba(255,255,255,0.03); white-space:nowrap; }
.fsx-chip.good { color:var(--success); border-color:rgba(79,190,130,.35); background:rgba(79,190,130,.08); }
.fsx-chip.warn { color:#FFD166; border-color:rgba(255,209,102,.35); background:rgba(255,209,102,.08); }
.fsx-chip.bad { color:var(--danger); border-color:rgba(224,88,76,.35); background:rgba(224,88,76,.08); }
.fsx-tagline { font-size:12.5px; color:var(--text-primary); line-height:1.5; margin:0 0 8px; }
.fsx-section { margin-top:18px; border-top:1px solid var(--line); padding-top:14px; }
.fsx-section-title { font-size:12px; color:var(--text-tertiary); letter-spacing:.08em; font-weight:800; margin-bottom:9px; }
.fsx-signal-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.fsx-signal { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:8px; padding:8px; }
.fsx-signal-k { font-size:10.5px; color:var(--text-tertiary); margin-bottom:4px; }
.fsx-signal-v { font-size:12px; line-height:1.45; color:var(--text-primary); }
.fsx-track-list { margin:0; padding-left:18px; color:var(--text-primary); font-size:12.5px; line-height:1.65; }
.fsx-mini-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 4px; }
.fsx-mini-box { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:8px; padding:8px; }
.fsx-mini-box b { display:block; font-size:10.5px; color:var(--text-tertiary); margin-bottom:3px; }
.fsx-mini-box span { font-size:12.5px; color:var(--text-primary); }
.fsx-source { font-size:11px; color:var(--text-tertiary); line-height:1.55; }

/* ---------- Scrollbars ---------- */
.fsx-grid::-webkit-scrollbar, .fsx-detail::-webkit-scrollbar { width: 8px; }
.fsx-grid::-webkit-scrollbar-thumb, .fsx-detail::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.fsx-grid::-webkit-scrollbar-track, .fsx-detail::-webkit-scrollbar-track { background: transparent; }

/* ---------- Responsive ---------- */
@media (max-width: 720px) {
  .fsx-body { flex-direction: column; }
  .fsx-detail { width: 100%; border-left: none; border-top: 1px solid var(--line); max-height: 320px; }
  .fsx-topbar-right { gap: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .fsx-card, .fsx-card-scanline, .fsx-download-btn { transition: none; }
  .fsx-card.fsx-foil, .fsx-card.fsx-foil::after, .fsx-tier-tag.fsx-foil-rainbow, .fsx-tier-tag.fsx-foil-gold, .fsx-foil-star {
    animation: none;
  }
}

<script>
// ============ 持久化儲存：偵測與輔助函式 ============
// window.storage 只在 claude.ai 的 artifact 環境裡才存在。
// 重要：這個物件有可能是「非同步注入」的——頁面剛載入的那一瞬間可能還沒掛上去，
// 太早做一次性的 typeof 判斷容易誤判成「不支援」。
// 改成：重試幾次、並且實際嘗試呼叫一次 set() 來確認真的能用，而不是只看物件存在。

let STORAGE_AVAILABLE = false; // 會在 detectStorageAvailability() 執行後更新成真正結果

async function detectStorageAvailability(maxRetries = 6, delayMs = 400) {
  for (let i = 0; i < maxRetries; i++) {
    if (typeof window.storage !== "undefined" && window.storage !== null) {
      try {
        // 實際呼叫一次，而不是只檢查物件存不存在——
        // 有些環境可能會先掛一個空殼物件、過一陣子才真正接上後端。
        const probeResult = await window.storage.set("__fsx_probe__", { ts: Date.now() }, false);
        if (probeResult) return true;
      } catch (e) {
        // 還沒準備好，等一下繼續重試
      }
    }
    await new Promise(r => setTimeout(r, delayMs));
  }
  // 重試多次後仍失敗，最後再看一次物件是否存在作為保底判斷
  return typeof window.storage !== "undefined" && window.storage !== null;
}

async function storageGet(key) {
  if (!STORAGE_AVAILABLE) return null;
  try {
    const result = await window.storage.get(key, false);
    return result ? result.value : null;
  } catch (e) {
    console.warn("storageGet 失敗：", key, e);
    return null;
  }
}

async function storageSet(key, value) {
  if (!STORAGE_AVAILABLE) return false;
  try {
    const result = await window.storage.set(key, value, false);
    return !!result;
  } catch (e) {
    console.warn("storageSet 失敗：", key, e);
    return false;
  }
}

async function storageDelete(key) {
  if (!STORAGE_AVAILABLE) return false;
  try {
    await window.storage.delete(key, false);
    return true;
  } catch (e) {
    return false;

function tierForScore(total) {
  if (total >= 4.5) return TIER.mythic;
  if (total >= 4.0) return TIER.legendary;
  if (total >= 3.5) return TIER.hero;
  if (total >= 3.0) return TIER.rare;
  if (total >= 2.0) return TIER.uncommon;
  return TIER.common;
}

function filterKeyForScore(total) {
  return tierForScore(total).key;
}

function chipHtml(chip) {
  return `<span class="fsx-chip ${chip.level || ''}">${chip.text}</span>`;
}

function signalBlockHtml(stock) {
  const s = stock.signals || {};
  const rows = [["本益比",s.pe],["法人籌碼",s.chip],["目標價",s.target],["流動性",s.liquidity]];
  return `<div class="fsx-signal-grid">${rows.map(([k,v]) => `<div class="fsx-signal"><div class="fsx-signal-k">${k}</div><div class="fsx-signal-v">${v || '資料不足'}</div></div>`).join('')}</div>`;
}

// ============ 渲染邏輯 ============

function totalScore(stock) {
  return stock.breakdown.reduce((sum, b) => sum + b.v, 0);
}

function starSvgMarkup() {
  // 星形路徑，供 SVG 版本（一般等級）跟 mask 版本（閃卡等級）共用同一個形狀
  return "M12 2.5l2.9 6.6 7.1.7-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L1.9 9.8l7.1-.7z";
}

function renderStars(total, tier) {
  // 每一顆星可以是 0 / 0.5 / 1。
  // 神話／傳說（foil）等級：填滿/半滿的星星改用「遮罩+動態漸層」，跟卡片邊框、標籤同一套流光動畫。
  // 其他等級：維持單色 SVG fill，跟卡片主色一致。
  const isFoil = !!(tier && tier.foil);
  let html = "";
  for (let i = 1; i <= 5; i++) {
    const remain = total - (i - 1);
    const filled = remain >= 1;
    const half = remain >= 0.5 && remain < 1;
    const opacity = half ? 0.45 : 1;

    if ((filled || half) && isFoil) {
      html += `<span class="fsx-star-slot" style="opacity:${opacity}">
        <span class="fsx-star-bg-base"></span>
        <span class="fsx-foil-star fsx-foil-${tier.foil}"></span>
      </span>`;
    } else {
      const fillAttr = filled || half ? `class="fsx-star-fill"` : `class="fsx-star-bg"`;
      html += `<span class="fsx-star-slot" style="opacity:${opacity}">
        <svg viewBox="0 0 24 24"><path ${fillAttr} d="${starSvgMarkup()}"/></svg>
      </span>`;
    }
  }
  return html;
}

function cardHtml(stock) {
  const total = totalScore(stock);
  const tier = tierForScore(total);
  const foilClass = tier.foil ? `fsx-foil fsx-foil-${tier.foil}` : "";
  return `
    <div class="fsx-card ${foilClass}" data-code="${stock.code}" data-total="${total}"
         style="--tier-color:${tier.color}; --tier-glow:${tier.glow}"
         tabindex="0" role="button" aria-label="${stock.name} ${stock.code}，${tier.name}，${total}星">
      <div class="fsx-card-scanline"></div>
      <div class="fsx-card-top">
        <span class="fsx-code fsx-mono">${stock.code}</span>
        <span class="fsx-tier-tag ${foilClass}">${tier.name} ${total}★</span>
      </div>
      <div class="fsx-name">${stock.name} · ${stock.market}</div>
      <div class="fsx-stars">${renderStars(total, tier)}</div>
      <div class="fsx-tagline">${stock.tagline || stock.verdict}</div>
      <div class="fsx-card-meta">
        ${chipHtml({text: stock.investorType || "觀察型", level: ""})}
        ${chipHtml({text: "流動性：" + (stock.liquidity?.text || "資料不足"), level: stock.liquidity?.level || ""})}
        ${(stock.riskTags || []).slice(0,2).map(chipHtml).join("")}
      </div>
      <div class="fsx-verdict">${stock.verdict}</div>
    </div>
  `;
}

function detailHtml(stock) {
  const total = totalScore(stock);
  const tier = tierForScore(total);
  const foilClass = tier.foil ? `fsx-foil fsx-foil-${tier.foil}` : "";
  const hasDoc = !!(stock.docFilename);
  return `
    <div style="--tier-color:${tier.color}; --tier-glow:${tier.glow}">
      <div class="fsx-detail-head">
        <span class="fsx-detail-code fsx-mono">${stock.code}</span>
        <span class="fsx-tier-tag ${foilClass}">${tier.name}</span>
      </div>
      <div class="fsx-detail-name">${stock.name} · ${stock.market}</div>
      <div class="fsx-detail-stars">${renderStars(total, tier)}</div>
      <div class="fsx-detail-total">總評分 <b>${total} / 5</b></div>
      <div class="fsx-tagline">${stock.tagline || stock.verdict}</div>
      <div class="fsx-mini-meta">
        <div class="fsx-mini-box"><b>投資人類型</b><span>${stock.investorType || "觀察型"}</span></div>
        <div class="fsx-mini-box"><b>流動性</b><span>${stock.liquidity?.text || "資料不足"}</span></div>
      </div>
      <div class="fsx-card-meta">${(stock.riskTags || []).map(chipHtml).join("")}</div>

      ${stock.breakdown.map((b, i) => `
        <div class="fsx-breakdown-row">
          <span class="fsx-bd-star fsx-mono">★${i + 1}</span>
          <span class="fsx-bd-text">${b.t}</span>
          <span class="fsx-bd-score" data-v="${b.v}">${b.v}</span>
        </div>
      `).join("")}

      <div class="fsx-section">
        <div class="fsx-section-title">★4 四項驗證燈號</div>
        ${signalBlockHtml(stock)}
      </div>

      <div class="fsx-section">
        <div class="fsx-section-title">下一次追蹤重點</div>
        <ul class="fsx-track-list">${(stock.next || []).map(x => `<li>${x}</li>`).join("")}</ul>
      </div>

      <div class="fsx-section">
        <div class="fsx-section-title">資料透明度</div>
        <div class="fsx-source">${stock.sources || "公開資料與五星分析報告。"}</div>
      </div>

      <div class="fsx-updated">最後更新：${stock.updated}</div>
      ${hasDoc ? `
      <button class="fsx-download-btn" id="fsx-dl-btn" data-code="${stock.code}">
        <span>⬇ 下載完整報告 (.docx)</span>
        <span class="fsx-download-size">${stock.docSizeKb ? stock.docSizeKb + " KB" : ""}</span>
      </button>
      ` : `
      <p style="font-size:12px; color:var(--text-tertiary); text-align:center; padding:10px 0;">加入交易所模式不產生報告檔案，因此下載按鈕留空。</p>
      `}
    </div>
  `;
}

function isIOSDevice() {
  const ua = navigator.userAgent || "";
  return /iPad|iPhone|iPod/.test(ua) || (ua.includes("Macintosh") && navigator.maxTouchPoints > 1);
}

function isAndroidDevice() {
  return /Android/.test(navigator.userAgent || "");
}

async function triggerDownload(code) {
  let doc = await storageGet("doc:" + code);
  if (!doc) doc = DOCS_DATA[code];
  if (!doc) return { ok: false, reason: "missing" };

  const mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

  // --- iOS：絕對不要用 <a download> 去點 data URI／blob URI ---
  // iOS Safari 對 docx 這類非原生可預覽格式，透過 <a download> 觸發下載時，
  // 會把它解讀成「要交給其他 App 打開」，於是跳出「正在嘗試開啟外部應用程式」對話框，
  // 即使按下「允許」，因為裝置上未必有對應 App 接手，畫面只是跳掉、沒有任何檔案被存下來。
  // 正確作法：用一個隱藏的 <iframe> 承載 data: URI，不離開目前頁面，
  // 由 Safari 對 iframe 內容的處理機制接手（彈出「在『檔案』中儲存」或預覽分享選單），
  // 這是 iOS 上對 docx／pdf 等文件下載最常見也最穩定的做法。
  if (isIOSDevice()) {
    try {
      const dataUrl = "data:" + mime + ";base64," + doc.b64;
      let iframe = document.getElementById("fsx-dl-iframe");
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.id = "fsx-dl-iframe";
        iframe.style.display = "none";
        document.body.appendChild(iframe);
      }
      iframe.src = dataUrl;
      return { ok: true, mode: "ios-iframe" };
    } catch (e) {
      return { ok: false, reason: "ios-exception" };
    }
  }

  // --- Android：data URI + <a download> 多數機型可正常運作 ---
  if (isAndroidDevice()) {
    try {
      const dataUrl = "data:" + mime + ";base64," + doc.b64;
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = doc.filename;
      a.rel = "noopener";
      a.style.position = "fixed";
      a.style.left = "-9999px";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { if (a.parentNode) a.parentNode.removeChild(a); }, 1500);
      return { ok: true, mode: "android-data-uri" };
    } catch (e) {
      return { ok: false, reason: "android-exception" };
    }
  }

  // --- 桌面瀏覽器：blob + <a download> 最穩定 ---
  try {
    const byteChars = atob(doc.b64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = doc.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return { ok: true, mode: "blob" };
  } catch (e) {
    return { ok: false, reason: "desktop-exception" };
  }
}

// ============ 初始化與事件綁定 ============

(async function init() {
  const root = document.getElementById("fsx-root");
  const grid = document.getElementById("fsx-grid");
  const tooltip = document.getElementById("fsx-tooltip");
  const detailEmpty = document.getElementById("fsx-detail-empty");
  const detailContent = document.getElementById("fsx-detail-content");
  const searchInput = document.getElementById("fsx-search");
  const tabs = root.querySelectorAll(".fsx-tab");
  const notice = document.getElementById("fsx-notice");

  let activeFilter = "all";
  let searchTerm = "";
  let selectedCode = null;

  // ---------- 啟動載入：先偵測儲存功能是否可用，再讀儲存、合併、或種子寫入 ----------
  grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-tertiary); padding:40px 0; font-size:13px;">偵測儲存環境…</div>`;
  STORAGE_AVAILABLE = await detectStorageAvailability();

  if (!STORAGE_AVAILABLE) {
    render();
  } else {
    await storageDelete("__fsx_probe__"); // 清掉偵測用的探測鍵，不留垃圾資料
    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-tertiary); padding:40px 0; font-size:13px;">讀取已儲存的股票資料…</div>`;
    const saved = await storageGet("stocks-list-v11-template");
    if (saved && Array.isArray(saved) && saved.length > 0) {
      // 若使用者之前已存過交易所資料，將新版內建股票以 code 合併進來，避免新卡片被舊快取蓋掉。
      const merged = [...saved];
      for (const seed of STOCKS) {
        const idx = merged.findIndex(x => x.code === seed.code);
        if (idx >= 0) merged[idx] = Object.assign({}, seed, merged[idx]);
        else merged.push(seed);
      }
      STOCKS = merged;
      await storageSet("stocks-list-v11-template", STOCKS);
    } else {
      // 第一次使用：把內建股票種子寫進儲存空間
      await storageSet("stocks-list-v11-template", STOCKS);
      for (const code of Object.keys(SEED_DOCS_DATA)) {
        await storageSet("doc:" + code, SEED_DOCS_DATA[code]);
      }
    }
  }

  function visibleStocks() {
    return STOCKS.filter(s => {
      const total = totalScore(s);
      const matchFilter = activeFilter === "all" || filterKeyForScore(total) === activeFilter;
      const matchSearch = !searchTerm ||
        s.code.includes(searchTerm) || s.name.includes(searchTerm);
      return matchFilter && matchSearch;
    }).sort((a, b) => {
      const diff = totalScore(b) - totalScore(a); // 總分由高到低
      if (diff !== 0) return diff;
      return a.code.localeCompare(b.code); // 同分時按代號排序，順序穩定不跳動
    });
  }

  function render() {
    const list = visibleStocks();
    document.getElementById("stat-count").textContent = STOCKS.length;
    document.getElementById("stat-checks").textContent = STOCKS.length * 5;
    grid.innerHTML = list.map(cardHtml).join("") ||
      `<div style="grid-column:1/-1; text-align:center; color:var(--text-tertiary); padding:40px 0; font-size:13px;">沒有符合條件的股票</div>`;
    bindCardEvents();
  }

  function selectStock(code) {
    selectedCode = code;
    const stock = STOCKS.find(s => s.code === code);
    if (!stock) return;
    detailEmpty.hidden = true;
    detailContent.hidden = false;
    detailContent.innerHTML = detailHtml(stock);

    grid.querySelectorAll(".fsx-card").forEach(c => {
      c.classList.toggle("selected", c.dataset.code === code);
    });

    const dlBtn = document.getElementById("fsx-dl-btn");
    if (dlBtn) {
      dlBtn.addEventListener("click", async () => {
        const span = dlBtn.querySelector("span");
        const originalText = span.textContent;
        const result = await triggerDownload(code);
        if (result.ok) {
          dlBtn.classList.add("fsx-download-done");
          span.textContent = "✓ 已下載";
          setTimeout(() => {
            dlBtn.classList.remove("fsx-download-done");
            span.textContent = originalText;
          }, 1800);
        } else {
          span.textContent = "下載失敗，請改用電腦開啟";
          setTimeout(() => { span.textContent = originalText; }, 2500);
        }
      });
    }
  }

  function showTooltip(stock, x, y) {
    tooltip.innerHTML = `<b>${stock.code} ${stock.name}</b><br/>${stock.verdict}`;
    tooltip.hidden = false;
    tooltip.style.left = (x + 16) + "px";
    tooltip.style.top = (y + 16) + "px";
  }

  function hideTooltip() { tooltip.hidden = true; }

  function bindCardEvents() {
    grid.querySelectorAll(".fsx-card").forEach(card => {
      const code = card.dataset.code;
      const stock = STOCKS.find(s => s.code === code);

      card.addEventListener("mouseenter", (e) => showTooltip(stock, e.clientX, e.clientY));
      card.addEventListener("mousemove", (e) => showTooltip(stock, e.clientX, e.clientY));
      card.addEventListener("mouseleave", hideTooltip);
      card.addEventListener("click", () => { hideTooltip(); selectStock(code); });
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectStock(code); }
      });
    });
  }

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      activeFilter = tab.dataset.filter;
      render();
    });
  });

  searchInput.addEventListener("input", (e) => {
    searchTerm = e.target.value.trim();
    render();
  });

  render();
})();

</script>
